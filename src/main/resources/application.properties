server.port=8088
spring.application.name=ocapp
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,browser
server.undertow.max-http-post-size=16KB
server.undertow.threads.worker=8

converter.browser.binary=
converter.browser.driver-path=
converter.browser.headless=true
converter.browser.extra-arguments=
converter.browser.page-load-timeout=30s
converter.browser.script-timeout=15s
converter.browser.readiness-timeout=15s
converter.browser.dom-quiet-period=500ms
converter.browser.settle-delay=0ms
converter.browser.readiness-selector=body
converter.browser.readiness-script=
converter.browser.viewport-width=1440
converter.browser.viewport-height=900
converter.browser.device-scale-factor=1.0
converter.browser.fail-startup-if-unavailable=false
converter.browser.cleanup-timeout=5s
converter.browser.health-probe-timeout=10s
converter.browser.health-cache-ttl=30s
converter.security.allowed-hosts=
converter.security.denied-hosts=
converter.security.allow-private-addresses=false
converter.security.max-redirects=5
converter.security.preflight-timeout=10s
converter.security.egress-mode=PROXY
converter.security.proxy-url=
converter.security.unsafe-acknowledge-risk=false
converter.limits.max-concurrent=2
converter.limits.acquire-timeout=100ms
converter.limits.operation-timeout=90s
converter.limits.max-output-bytes=52428800
converter.limits.max-capture-width=10000
converter.limits.max-capture-height=50000
converter.limits.max-capture-pixels=100000000
converter.limits.max-screenshot-bytes=52428800
converter.page-model.max-blocks=5000
converter.page-model.max-depth=64
converter.page-model.max-text-length=1000000
converter.page-model.max-table-cells=20000
converter.page-model.max-assets=2000
converter.page-model.max-asset-bytes=52428800
converter.page-model.max-coordinate=1000000
converter.page-model.max-warnings=500
converter.page-model.max-overlap-checks=100000
converter.page-model.max-field-length=4096
converter.page-model.max-metadata-characters=250000
converter.pdf.landscape=false
converter.pdf.paper-width-inches=8.27
converter.pdf.paper-height-inches=11.69
converter.pdf.margin-inches=0.4
converter.pptx.slide-width-inches=13.333
converter.pptx.slide-height-inches=7.5
converter.pptx.max-slides=100
converter.pptx.smart-pagination-enabled=true
converter.pptx.editable-enabled=true
converter.pptx.legacy-fallback-enabled=true
converter.pptx.max-items-per-slide=1000
converter.pptx.max-native-table-cells=500
converter.pptx.max-native-table-columns=12
converter.pptx.min-native-table-column-points=18
converter.pptx.min-slice-height-pixels=120
converter.pptx.graphics-export-scale=2.0
converter.pptx.graphics-export-background=transparent
converter.pptx.graphics-export-format=png
converter.pptx.max-graphics-export-pixels=16000000
converter.pptx.max-graphics-export-bytes=8388608
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n
